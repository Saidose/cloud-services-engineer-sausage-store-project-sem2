apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:7.0
        envFrom:
          - configMapRef:
              name: mongodb-conf
        env:
          - name: MONGO_INITDB_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mongodb-secret
                key: MONGO_INITDB_ROOT_PASSWORD
        ports:
        - containerPort: {{ .Values.mongodb.containerPort }}
        resources:
{{ toYaml .Values.mongodb.resources | indent 10 }}
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
  volumeClaimTemplates:
  - metadata:
      name: mongodb-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: {{ .Values.mongodb.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app: mongodb
spec:
  ports:
  - port: {{ .Values.mongodb.containerPort }}
    targetPort: {{ .Values.mongodb.containerPort }}
  selector:
    app: mongodb
  clusterIP: None
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-conf
data:
  MONGO_INITDB_ROOT_USERNAME: "{{ .Values.mongodb.env.MONGO_INITDB_ROOT_USERNAME }}"
  MONGO_REPORTS_USERNAME: "{{ .Values.mongodb.env.MONGO_REPORTS_USERNAME }}"
  MONGO_REPORTS_DATABASE: "{{ .Values.mongodb.env.MONGO_REPORTS_DATABASE }}"
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
type: Opaque
stringData:
  MONGO_INITDB_ROOT_PASSWORD: "{{ .Values.mongodb.env.MONGO_INITDB_ROOT_PASSWORD }}"
  MONGO_REPORTS_PASSWORD: "{{ .Values.mongodb.env.MONGO_REPORTS_PASSWORD }}"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-create-reports-user
  annotations:
    helm.sh/hook: "post-install,post-upgrade"
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongodb-create-reports-user
          image: mongo:7.0
          envFrom:
            - configMapRef:
                name: mongodb-conf
          env:
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: MONGO_REPORTS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_REPORTS_PASSWORD
          resources:
{{ toYaml .Values.mongodb.jobResources | indent 12 }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mongosh "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/admin" --eval "
                db = db.getSiblingDB('${MONGO_REPORTS_DATABASE}');
                if (db.getUser('${MONGO_REPORTS_USERNAME}') == null) {
                  db.createUser({
                    user: '${MONGO_REPORTS_USERNAME}',
                    pwd: '${MONGO_REPORTS_PASSWORD}',
                    roles: [{ role: 'readWrite', db: '${MONGO_REPORTS_DATABASE}' }]
                  });
                }
              "
