# Source: sausage-store/charts/infra/templates/mongodb.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-create-reports-user
  annotations:
    helm.sh/hook: "post-install,post-upgrade"
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongodb-create-reports-user
          image: mongo:7.0
          envFrom:
            - configMapRef:
                name: mongodb-conf
          env:
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: MONGO_REPORTS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_REPORTS_PASSWORD
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mongosh "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/admin" --eval "
                db = db.getSiblingDB('${MONGO_REPORTS_DATABASE}');
                if (db.getUser('${MONGO_REPORTS_USERNAME}') == null) {
                  db.createUser({
                    user: '${MONGO_REPORTS_USERNAME}',
                    pwd: '${MONGO_REPORTS_PASSWORD}',
                    roles: [{ role: 'readWrite', db: '${MONGO_REPORTS_DATABASE}' }]
                  });
                }
              "
